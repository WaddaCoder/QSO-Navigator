<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QSO Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1520; --surface: #101E2E; --surface2: #0C1A28;
    --accent: #3A7BD5; --accent-dim: #1E3A5A;
    --gold: #C9A84C; --gold-dim: #4A3D1E;
    --text: #FFFFFF; --text2: #FFFFFF;
    --muted: #3A6A8A; --muted2: #2A4A6A; --border: #1A2E42;
    --success: #4ACA7A; --success-bg: #0D2A1A; --success-border: #1A4A2A;
    --radius: 12px; --radius-sm: 8px;
    --fs-xs: 0.65rem; --fs-sm: 0.75rem; --fs-base: 0.9rem; --fs-lg: 1.05rem; --fs-xl: 1.3rem; --fs-2xl: 1.6rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text2); font-family: 'Inter', sans-serif; font-size: var(--fs-base); -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }

  .header { padding: 20px 18px 14px; border-bottom: 0.5px solid var(--border); }
  .header-toprow { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .header-icons { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; background: #1A2838; border: 1px solid #2A3A4A; color: #C8C8C8; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; flex-shrink: 0; }
  .app-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-2xl); font-weight: 700; color: var(--text); line-height: 1.1; }
  .app-title .gold-word { color: var(--gold); }
  .app-subtitle { font-size: var(--fs-sm); color: #C8C8C8; margin-top: 6px; }
  .accent-line { height: 2px; width: 40px; background: var(--accent); border-radius: 2px; margin-top: 10px; }

  .ms-header { padding: 16px 18px 14px; border-bottom: 0.5px solid var(--border); }
  .ms-toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ms-home-btn { width: 34px; height: 34px; border-radius: 9px; background: #E8E8E8; color: #0D1520; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .ms-tag { font-size: var(--fs-xs); font-weight: 700; color: #1A1408; background: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 3px 9px; display: inline-block; width: fit-content; }
  .ms-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-xl); font-weight: 700; color: var(--text2); }
  .ms-intro { font-size: var(--fs-sm); color: #E8E8E8; line-height: 1.6; padding: 0 18px 14px; border-bottom: 0.5px solid var(--border); }

  .section-label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; padding: 16px 18px 8px; }

  .module-card { margin: 0 14px 10px; background: var(--surface); border: 0.5px solid var(--accent-dim); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.15s, transform 0.15s; }
  .module-card:active { transform: scale(0.98); }
  .module-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .module-card.defs::before { background: #8B7BDF; }
  .module-card.wit::before { background: #3A7BD5; }
  .module-card.conf::before { background: #5AAFB0; }
  .module-card.rel::before { background: #C9856A; }
  .module-card.dying::before { background: #B05A6A; }
  .module-card.burden::before { background: #5A9A6A; }
  .module-card.expert::before { background: #9A8A4A; }
  .module-card.disabled { opacity: 0.45; cursor: default; }
  .module-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .module-section-tag { font-size: var(--fs-xs); font-weight: 700; padding: 3px 9px; border-radius: 5px; }
  .module-card.defs .module-section-tag { color: #180D30; background: #B4A0FF; }
  .module-card.wit .module-section-tag { color: #0A1626; background: #6FA8F0; }
  .module-card.conf .module-section-tag { color: #06201E; background: #6FCBCC; }
  .module-card.rel .module-section-tag { color: #2A1208; background: #E0A088; }
  .module-card.dying .module-section-tag { color: #2A0A10; background: #E0A0AC; }
  .module-card.burden .module-section-tag { color: #0A2010; background: #A0E0AC; }
  .module-card.expert .module-section-tag { color: #201A0A; background: #E0D0A0; }
  .module-chevron { color: var(--muted2); font-size: var(--fs-lg); }
  .module-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 700; color: var(--text2); margin-bottom: 3px; }
  .module-hint { font-size: var(--fs-xs); color: #C8C8C8; }
  .module-pill { display: inline-block; margin-top: 8px; font-size: var(--fs-xs); font-weight: 700; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--gold); color: #1A1408; background: var(--gold); }
  .module-pill.pending { background: transparent; color: var(--muted); border-color: var(--muted2); }

  .arc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 14px 14px; }
  .arc-card { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .arc-icon { font-size: 16px; margin-bottom: 4px; }
  .arc-title { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; font-weight: 600; color: #A8C4DC; margin-bottom: 3px; }
  .arc-body { font-size: var(--fs-xs); color: #C8C8C8; line-height: 1.5; }

  .defs-search-wrap { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  .defs-search { flex: 1; background: var(--surface); border: 0.5px solid var(--accent-dim); border-radius: var(--radius-sm); padding: 10px 14px; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: var(--fs-base); }
  .defs-search::placeholder { color: var(--muted2); }
  .defs-collapse-all { font-size: var(--fs-xs); color: var(--muted); border: 0.5px solid var(--accent-dim); border-radius: var(--radius-sm); padding: 10px 12px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }

  .sparring-toggle-wrap { margin: 0 14px 14px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .sparring-toggle-label { font-weight: 700; color: #FFFFFF; font-size: var(--fs-base); margin-bottom: 2px; }
  .sparring-toggle-state { font-size: var(--fs-xs); color: #C8C8C8; letter-spacing: 0.3px; }
  .sparring-switch { width: 54px; height: 30px; border-radius: 16px; background: #2A3A4A; position: relative; flex-shrink: 0; transition: background 0.2s; }
  .sparring-switch.on { background: var(--gold); }
  .sparring-switch-knob { width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; position: absolute; top: 3px; left: 3px; transition: left 0.2s; }
  .sparring-switch.on .sparring-switch-knob { left: 27px; }

  .progress-bar-wrap { padding: 10px 16px 4px; display: flex; align-items: center; gap: 8px; }
  .progress-bar { flex: 1; height: 3px; background: #3A3A3A; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.3s ease; }
  .progress-text { font-size: var(--fs-xs); color: #E8E8E8; white-space: nowrap; }

  .element-list { padding-bottom: 8px; }
  .element-card { margin: 8px 14px; background: var(--surface); border: 0.5px solid var(--accent-dim); border-radius: 10px; padding: 13px 14px; transition: all 0.2s; }
  .element-card.pending { opacity: 0.5; }
  .element-card.done { opacity: 0.85; }
  .element-card.active { border-color: var(--gold); background: #F4F0E6; }
  .element-card.active .element-number { color: #8A6A1A; }
  .element-card.active .element-label { color: #0D1520; }
  .element-card.active .element-detail { color: #2A2A2A; }
  .element-number { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 1px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
  .check-icon { color: var(--success); }
  .element-label { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 700; color: #FFFFFF; margin-bottom: 4px; }
  .element-detail { font-size: var(--fs-sm); color: #C8C8C8; line-height: 1.6; }

  .illustration-box { margin-top: 10px; background: #0A1018; border: 1px solid var(--accent-dim); border-radius: 8px; padding: 10px 12px; }
  .element-card.active .illustration-box { background: #1A1408; border-color: var(--gold-dim); }
  .illustration-label { font-size: var(--fs-xs); font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
  .illustration-text { font-size: var(--fs-sm); color: #D8D0C0; line-height: 1.6; font-style: italic; }

  .gate-result-tag { display: inline-block; margin-top: 10px; font-size: var(--fs-xs); font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .gate-result-tag.admissible { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
  .gate-result-tag.excluded { background: #2A1A08; border: 1px solid var(--gold-dim); color: var(--gold); }

  .element-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; font-size: var(--fs-sm); cursor: pointer; border: none; font-family: 'Inter', sans-serif; }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-secondary { background: transparent; border: 1px solid #C8BC9C; color: #4A4030; }
  .btn-yes { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
  .btn-no { background: #2A1A08; border: 1px solid var(--gold-dim); color: var(--gold); }

  .case-panel { margin: 6px 14px 16px; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold-dim); }
  .case-header { background: #1A1608; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .case-header-left { display: flex; align-items: center; gap: 8px; }
  .case-star { color: var(--gold); font-size: 13px; }
  .case-header-label { font-size: var(--fs-xs); font-weight: 700; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; }
  .case-header-action { font-size: var(--fs-xs); color: #D8C898; }
  .case-body { background: #1A1608; padding: 0 12px; max-height: 0; overflow: hidden; transition: max-height 0.25s ease, padding 0.25s ease; }
  .case-body.open { padding: 12px; max-height: 1200px; }
  .case-item { border: 1px dashed var(--gold-dim); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .case-item:last-child { margin-bottom: 0; }
  .case-name { font-family: 'Inter', monospace; font-size: var(--fs-sm); font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .case-citation { font-size: var(--fs-xs); color: #B8A878; margin-bottom: 6px; }
  .case-held { font-size: var(--fs-sm); color: #D8D0C0; line-height: 1.6; margin-bottom: 4px; }
  .case-significance { font-size: var(--fs-xs); color: #A89870; font-style: italic; }

  .defs-rail-item { margin: 6px 14px; background: var(--surface); border: 1px solid var(--accent-dim); border-radius: 10px; overflow: hidden; transition: border-color 0.15s; }
  .defs-rail-item.priority { border-color: var(--gold-dim); }
  .defs-rail-item.expanded { background: #1A2838; border-color: var(--gold); }
  .defs-rail-header { padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .defs-rail-code { font-family: 'Inter', monospace; font-size: var(--fs-xs); color: var(--muted); flex-shrink: 0; width: 40px; padding-top: 2px; }
  .defs-rail-item.expanded .defs-rail-code { color: var(--gold); }
  .defs-rail-text { flex: 1; }
  .defs-rail-term { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 700; color: #FFFFFF; margin-bottom: 2px; }
  .defs-rail-star { color: var(--gold); font-size: var(--fs-xs); margin-right: 4px; }
  .defs-rail-sub { font-size: var(--fs-xs); color: #C8C8C8; line-height: 1.4; }
  .defs-rail-chevron { width: 10px; height: 10px; flex-shrink: 0; margin-top: 4px; color: var(--muted2); font-size: var(--fs-sm); transition: transform 0.2s; }
  .defs-rail-item.expanded .defs-rail-chevron { color: var(--gold); transform: rotate(90deg); }
  .defs-rail-expand-content { border-top: 0.5px solid var(--accent-dim); }
  .defs-empty { margin: 20px 16px; text-align: center; color: var(--muted); font-size: var(--fs-sm); }

  .defs-cases-bar { margin: 10px 12px 0; background: #1A1608; border: 1px solid var(--gold-dim); border-radius: 18px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .defs-cases-bar.open { border-radius: 12px 12px 0 0; }
  .defs-cases-bar-left { display: flex; align-items: center; gap: 8px; }
  .defs-cases-bar-star { color: var(--gold); font-size: 13px; }
  .defs-cases-bar-label { font-size: var(--fs-xs); font-weight: 700; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; }
  .defs-cases-bar-action { font-size: var(--fs-xs); color: #D8C898; letter-spacing: 0.5px; }
  .defs-cases-body { background: #1A1608; border: 1px solid var(--gold-dim); border-top: none; border-radius: 0 0 12px 12px; padding: 12px; margin: 0 12px; }
  .defs-case-subcard { border: 1px dashed var(--gold-dim); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .defs-case-subcard:last-child { margin-bottom: 0; }
  .defs-case-name { font-family: 'Inter', monospace; font-size: var(--fs-sm); font-weight: 700; color: var(--gold); margin-bottom: 6px; }
  .defs-case-teaser { font-size: var(--fs-sm); color: #D8D0C0; font-style: italic; line-height: 1.6; }

  .defs-position-panel { margin: 10px 12px 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--accent-dim); }
  .defs-position-header { background: var(--accent); color: #FFFFFF; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 14px; }
  .defs-position-body { background: #F4F0E6; color: #1A1408; padding: 14px; }
  .defs-position-text { font-size: var(--fs-base); line-height: 1.7; margin-bottom: 12px; }
  .defs-position-link { font-size: var(--fs-sm); color: var(--accent); font-weight: 600; text-decoration: underline; display: inline-block; }

  .sparring-panel { margin: 10px 12px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--accent-dim); }
  .sparring-panel-header { background: #2A3550; color: #FFFFFF; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
  .sparring-panel-header-action { font-size: var(--fs-xs); color: #B8C4E0; text-transform: none; letter-spacing: 0.3px; font-weight: 600; }
  .sparring-panel-body { background: #F4F0E6; color: #1A1408; padding: 0 14px; max-height: 0; overflow: hidden; transition: max-height 0.25s ease, padding 0.25s ease; }
  .sparring-panel-body.open { padding: 4px 14px 14px; max-height: 3000px; }
  .sparring-q-block { padding: 14px 0; border-top: 1px solid #D8D0BC; }
  .sparring-q-block:first-child { border-top: none; }
  .sparring-q-label { font-size: var(--fs-xs); font-weight: 700; color: #8A7A3A; letter-spacing: 1px; margin-bottom: 6px; }
  .sparring-q-text { font-size: var(--fs-base); line-height: 1.6; margin-bottom: 10px; }
  .sparring-q-textarea { width: 100%; min-height: 60px; border: 1px solid #C8BC9C; border-radius: 8px; background: #E8E2D0; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: var(--fs-sm); color: #1A1408; resize: vertical; margin-bottom: 10px; }
  .sparring-q-textarea::placeholder { color: #8A8068; }
  .sparring-reveal-btn { border: 1px solid #8A7A5A; border-radius: 8px; text-align: center; padding: 10px; font-weight: 600; color: #3A4A8A; cursor: pointer; font-size: var(--fs-sm); }
  .sparring-q-answer { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #C8BC9C; font-size: var(--fs-sm); line-height: 1.6; color: #3A3020; font-style: italic; }

  .boundary-note { margin: 4px 14px 16px; background: #1A1608; border: 1px solid var(--gold-dim); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-sm); color: #D8C898; line-height: 1.6; }

  .restart-link { margin: 4px 14px 18px; text-align: center; color: var(--muted); font-size: var(--fs-xs); cursor: pointer; text-decoration: underline; }
</style>
</head>

<div class="app" id="app"></div>

<script>
/* ============================================================
   DATA — QSO Order, 1984 (curated v1 scope)
   Source: Qanun-e-Shahadat Order, 1984, Articles as OCR'd from
   the uploaded reference PDF. Case citations are placeholders
   pending Khokhar's physical-book verification pass, per
   standing policy — never gate module completion on this.
   ============================================================ */

var DEFS_TERMS = [
  {
    code: '2(b)', term: 'Document', clause: 'Art. 2(1)(b)',
    summary: 'matter expressed on any substance, intended to record it',
    priority: false,
    position: 'A document is any matter expressed or described upon any substance by letters, figures, or marks, intended to be used or capable of being used to record that matter. The Order\'s illustrations are deliberately broad: a writing, a printed or photographed text, a map, an inscription on metal or stone, even a caricature all qualify. The test is intent-to-record plus a substance carrying the marks, not any particular medium.',
    officialText: 'Qanun-e-Shahadat Order, 1984 — Art. 2(1)(b)',
    landmarkCases: []
  },
  {
    code: '2(c)', term: 'Evidence', clause: 'Art. 2(1)(c)',
    summary: 'oral statements + documents produced for the Court\'s inspection',
    priority: true,
    position: 'Evidence under Art. 2(1)(c) has two and only two species: oral evidence (statements the Court permits or requires before it) and documentary evidence (documents produced for the Court\'s inspection). A weapon or a stolen item is not "evidence" in this defined sense until a witness or document proves its connection to the facts in issue — the object itself is exhibited, not testified. This binary is the reason every later Article in Part I sorts cleanly into either the oral-evidence chapter (Ch. IV) or the documentary-evidence chapter (Ch. V).',
    officialText: 'Qanun-e-Shahadat Order, 1984 — Art. 2(1)(c)',
    landmarkCases: []
  },
  {
    code: '2(d)', term: 'Fact', clause: 'Art. 2(1)(d)',
    summary: 'anything perceivable by the senses, or a mental condition',
    priority: false,
    position: 'A fact is either (i) anything, state of things, or relation of things capable of being perceived by the senses, or (ii) any mental condition of which a person is conscious. The Order\'s own illustrations matter here: that a man held a certain opinion, acted in good faith or fraudulently, or used a word in a particular sense are all "facts" — mental states are not excluded just because they cannot be physically observed.',
    officialText: 'Qanun-e-Shahadat Order, 1984 — Art. 2(1)(d)',
    landmarkCases: []
  },
  {
    code: '2(4–6)', term: 'Proved / Disproved / Not Proved', clause: 'Art. 2(1)(4)–(6)',
    summary: 'the "prudent man" standard the Court applies to every fact',
    priority: true,
    position: 'A fact is proved when the Court believes it exists, or considers its existence so probable that a prudent man ought to act on the supposition it exists. Disproved is the mirror image. Not proved is neither — the residual category. This three-way standard, not "beyond reasonable doubt" or "balance of probabilities" as separate doctrines, is QSO\'s own definitional baseline; the criminal/civil standard-of-proof distinction operates on top of it, not instead of it.',
    officialText: 'Qanun-e-Shahadat Order, 1984 — Art. 2(1)(4)–(6)',
    landmarkCases: []
  }
];

var CONF_GATES = [
  {
    code: 'Art. 37', label: 'Was it induced, threatened, or promised?',
    detail: 'A confession is irrelevant in a criminal proceeding if the Court finds it was caused by an inducement, threat, or promise — relating to the charge, from a person in authority, and sufficient to give the accused reasonable grounds to expect an advantage or escape an evil of a temporal nature.',
    illustration: null,
    yesResult: { tag: 'excluded', text: 'Coercion found — irrelevant under Art. 37 (unless cured — see Gate 4)' },
    noResult: { tag: 'admissible', text: 'No coercion found — passes Gate 1' }
  },
  {
    code: 'Art. 38', label: 'Was it made to a police officer?',
    detail: 'No confession made to a police officer may be proved against the accused. This bar is absolute — there is no balancing test, no exception for rank or circumstance.',
    illustration: null,
    yesResult: { tag: 'excluded', text: 'Made to police — excluded under Art. 38, no further inquiry on this gate' },
    noResult: { tag: 'admissible', text: 'Not made to police — passes Gate 2' }
  },
  {
    code: 'Art. 39 & 40', label: 'Was the accused in police custody, and did it lead to a discovery?',
    detail: 'Art. 39: a confession made while in police custody is inadmissible unless made in a Magistrate\'s immediate presence. Art. 40 carves out a narrow exception — if the statement led to discovery of a fact (e.g. a weapon\'s location), only the portion "distinctly relating" to that discovered fact may be proved, confession or not.',

];

function renderGateCard(gate, idx, prefix, judgments, currentGate) {
  var state_cls = 'pending';
  if (judgments.hasOwnProperty(idx)) state_cls = 'done';
  else if (idx === currentGate) state_cls = 'active';

  var html = '<div class="element-card ' + state_cls + '">';
  var numHtml = 'Gate ' + String(idx + 1).padStart(2, '0') + ' &mdash; ' + gate.code;
  if (state_cls === 'done') numHtml += ' <span class="check-icon">&#10003;</span>';
  else if (state_cls === 'active') numHtml += ' &mdash; Active';
  html += '<div class="element-number">' + numHtml + '</div>';
  html += '<div class="element-label">' + gate.label + '</div>';
  html += '<div class="element-detail">' + gate.detail + '</div>';

  if (gate.illustration && (state_cls === 'active' || state_cls === 'done')) {
    html += '<div class="illustration-box"><div class="illustration-label">Illustration</div>';
    html += '<div class="illustration-text">' + gate.illustration + '</div></div>';
  }

  if (state_cls === 'done') {
    var verdict = judgments[idx] === 'yes' ? gate.yesResult : gate.noResult;
    html += '<div class="gate-result-tag ' + verdict.tag + '">' + verdict.text + '</div>';
  }

  if (state_cls === 'active') {
    html += '<div class="element-actions">';
    html += '<button class="btn btn-yes" data-gateyes="' + prefix + ':' + idx + '">Yes</button>';
    html += '<button class="btn btn-no" data-gateno="' + prefix + ':' + idx + '">No</button>';
    html += '</div>';
    if (idx > 0) {
      html += '<div class="element-actions"><button class="btn btn-secondary" data-gateback="' + prefix + ':' + idx + '">Back</button></div>';
    }
  }

  html += '</div>';
  return html;
}

function gatesFor(prefix) { return prefix === 'conf' ? CONF_GATES : DYING_GATES; }
function judgmentsFor(prefix) { return prefix === 'conf' ? state.confJudgments : state.dyingJudgments; }

function answerGate(prefix, idx, val) {
  var judgments = judgmentsFor(prefix);
  var gates = gatesFor(prefix);
  judgments[idx] = val;
  var nextGate = (idx + 1 < gates.length) ? idx + 1 : -1;
  if (prefix === 'conf') state.confCurrentGate = nextGate;
  else state.dyingCurrentGate = nextGate;
  render();
}

function backGate(prefix, idx) {
  var judgments = judgmentsFor(prefix);
  delete judgments[idx - 1];
  if (prefix === 'conf') state.confCurrentGate = idx - 1;
  else state.dyingCurrentGate = idx - 1;
  render();
}

function restartModule(prefix) {
  if (prefix === 'conf') {
    state.confCurrentGate = 0; state.confJudgments = {}; state.confCasesOpen = false; state.confSparringRevealed = {};
  } else {
    state.dyingCurrentGate = 0; state.dyingJudgments = {}; state.dyingCasesOpen = false; state.dyingSparringRevealed = {};
  }
  render();
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function attachHandlers() {
  var sparringToggle = document.getElementById('sparring-toggle');
  if (sparringToggle) {
    sparringToggle.onclick = function () { state.sparringOn = !state.sparringOn; render(); };
  }

  var homeSearch = document.getElementById('home-search');
  if (homeSearch) {
    homeSearch.oninput = function () { /* v1: home search is visual-only placeholder, wired in a later pass */ };
  }

  var defsSearch = document.getElementById('defs-search');
  if (defsSearch) {
    defsSearch.oninput = function (e) { state.defsQuery = e.target.value; render(); var el = document.getElementById('defs-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var witSearch = document.getElementById('wit-search');
  if (witSearch) {
    witSearch.oninput = function (e) { state.witQuery = e.target.value; render(); var el = document.getElementById('wit-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var relSearch = document.getElementById('rel-search');
  if (relSearch) {
    relSearch.oninput = function (e) { state.relQuery = e.target.value; render(); var el = document.getElementById('rel-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var burdenSearch = document.getElementById('burden-search');
  if (burdenSearch) {
    burdenSearch.oninput = function (e) { state.burdenQuery = e.target.value; render(); var el = document.getElementById('burden-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var expertSearch = document.getElementById('expert-search');
  if (expertSearch) {
    expertSearch.oninput = function (e) { state.expertQuery = e.target.value; render(); var el = document.getElementById('expert-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var admSearch = document.getElementById('adm-search');
  if (admSearch) {
    admSearch.oninput = function (e) { state.admQuery = e.target.value; render(); var el = document.getElementById('adm-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  }

  var collapseAll = document.getElementById('defs-collapse-all');
  if (collapseAll) {
    collapseAll.onclick = function () { state.defsExpanded = null; state.defsCasesOpen = false; render(); };
  }

  var witCollapseAll = document.getElementById('wit-collapse-all');
  if (witCollapseAll) {
    witCollapseAll.onclick = function () { state.witExpanded = null; state.witCasesOpen = false; render(); };
  }

  var relCollapseAll = document.getElementById('rel-collapse-all');
  if (relCollapseAll) {
    relCollapseAll.onclick = function () { state.relExpanded = null; state.relCasesOpen = false; render(); };
  }

  var burdenCollapseAll = document.getElementById('burden-collapse-all');
  if (burdenCollapseAll) {
    burdenCollapseAll.onclick = function () { state.burdenExpanded = null; state.burdenCasesOpen = false; render(); };
  }

  var expertCollapseAll = document.getElementById('expert-collapse-all');
  if (expertCollapseAll) {
    expertCollapseAll.onclick = function () { state.expertExpanded = null; state.expertCasesOpen = false; render(); };
  }

  var admCollapseAll = document.getElementById('adm-collapse-all');
  if (admCollapseAll) {
    admCollapseAll.onclick = function () { state.admExpanded = null; state.admCasesOpen = false; render(); };
  }

  var headers = document.querySelectorAll('.defs-rail-header');
  for (var i = 0; i < headers.length; i++) {
    headers[i].onclick = function () {
      var code = this.getAttribute('data-defcode');
      var group = this.getAttribute('data-defgroup');
      var expKey = group + 'Expanded', casesKey = group + 'CasesOpen';
      if (state[expKey] === code) state[expKey] = null;
      else { state[expKey] = code; state[casesKey] = false; }
      render();
    };
  }

  var casesBars = document.querySelectorAll('.defs-cases-bar');
  for (var cb = 0; cb < casesBars.length; cb++) {
    casesBars[cb].onclick = function () {
      var group = this.getAttribute('data-casesgroup');
      var casesKey = group + 'CasesOpen';
      state[casesKey] = !state[casesKey];
      render();
    };
  }

  var confCasesToggle = document.getElementById('conf-cases-toggle');
  if (confCasesToggle) {
    confCasesToggle.onclick = function () { state.confCasesOpen = !state.confCasesOpen; render(); };
  }

  var dyingCasesToggle = document.getElementById('dying-cases-toggle');
  if (dyingCasesToggle) {
    dyingCasesToggle.onclick = function () { state.dyingCasesOpen = !state.dyingCasesOpen; render(); };
  }

  var yesBtns = document.querySelectorAll('[data-gateyes]');
  for (var y = 0; y < yesBtns.length; y++) {
    yesBtns[y].onclick = function () {
      var parts = this.getAttribute('data-gateyes').split(':');
      answerGate(parts[0], parseInt(parts[1], 10), 'yes');
    };
  }
  var noBtns = document.querySelectorAll('[data-gateno]');
  for (var n = 0; n < noBtns.length; n++) {
    noBtns[n].onclick = function () {
      var parts = this.getAttribute('data-gateno').split(':');
      answerGate(parts[0], parseInt(parts[1], 10), 'no');
    };
  }
  var backBtns = document.querySelectorAll('[data-gateback]');
  for (var b = 0; b < backBtns.length; b++) {
    backBtns[b].onclick = function () {
      var parts = this.getAttribute('data-gateback').split(':');
      backGate(parts[0], parseInt(parts[1], 10));
    };
  }

  var revealBtns = document.querySelectorAll('[data-reveal]');
  for (var r = 0; r < revealBtns.length; r++) {
    revealBtns[r].onclick = function () {
      var parts = this.getAttribute('data-reveal').split(':');
      var revealKey = parts[0] + 'SparringRevealed';
      state[revealKey][parts[1]] = true;
      render();
    };
  }

  var restartBtns = document.querySelectorAll('[data-restart]');
  for (var rs = 0; rs < restartBtns.length; rs++) {
    restartBtns[rs].onclick = function () { restartModule(this.getAttribute('data-restart')); };
  }

  var sparringToggles = document.querySelectorAll('[data-sparringtoggle]');
  for (var st = 0; st < sparringToggles.length; st++) {
    sparringToggles[st].onclick = function () {
      var prefix = this.getAttribute('data-sparringtoggle');
      var openKey = prefix + 'SparringOpen';
      state[openKey] = !state[openKey];
      render();
    };
  }
}


function admFilteredList() {
  var q = state.admQuery.trim().toLowerCase();
  if (q === '') return ADM_TERMS;
  return ADM_TERMS.filter(function (d) {
    return d.term.toLowerCase().indexOf(q) !== -1 || d.position.toLowerCase().indexOf(q) !== -1;
  });
}

function renderAdm() {
  var html = '';
  html += '<div class="ms-header"><div class="ms-toprow"><span class="ms-tag">ART. 30&ndash;36</span>';
  html += '<div class="ms-home-btn" onclick="goScreen(\'home\')">&#8962;</div></div>';
  html += '<div class="ms-title">Admissions</div></div>';
  html += '<div class="ms-intro">Any statement that suggests an inference against you is an admission &mdash; civil or criminal, oral or written. Six Articles define who makes them, who can use them, and the one direction they can\'t flow. Tap a term to expand.</div>';

  html += '<div class="defs-search-wrap"><input class="defs-search" id="adm-search" value="' + state.admQuery + '" placeholder="Search terms...">';
  html += '<div class="defs-collapse-all" id="adm-collapse-all">Collapse All</div></div>';

  var alist = admFilteredList();
  if (alist.length === 0) {
    html += '<div class="defs-empty">No terms match your search.</div>';
  } else {
    for (var ai = 0; ai < alist.length; ai++) {
      html += renderDefsItem(alist[ai], state.admExpanded, state.admCasesOpen, 'adm');
    }
  }
  if (state.sparringOn) {
    html += renderSparringPanel(ADM_SPARRING, state.admSparringRevealed, 'adm', state.admSparringOpen);
  }
  html += '<div class="boundary-note">&#9888;&#65039; This module covers Art. 30&ndash;36 only. Confessions (Art. 37&ndash;45) are a separate module with their own gate sequence. Art. 30&ndash;36 governs all non-confession admissions: civil admissions, admissions by agents and predecessors in title, and the without-prejudice rule.</div>';
  return html;
}
